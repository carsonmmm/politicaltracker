name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATA_DIR: ${{ runner.temp }}/midterm-data
      - name: Check which data sources GitHub's runners can reach
        run: npm run probe
