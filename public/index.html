<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midterm Live</title>
  <meta name="description" content="Live results, market odds and race context for the November 3, 2026 U.S. midterm elections.">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Midterm <span>Live</span></a>
    <span id="live" class="live" aria-live="polite">Connecting…</span>
    <nav class="nav" aria-label="Main">
      <a href="#/">Dashboard</a>
      <a href="#/races">Races</a>
      <a href="#/odds">Odds</a>
      <a href="#/sim">Simulator</a>
      <a href="#/after">After the night</a>
      <a href="#/sources">Sources</a>
      <a href="#/admin">Admin</a>
    </nav>
    <button id="theme" class="theme-btn" type="button" aria-label="Toggle light or dark mode">◐</button>
  </header>
  <div id="banner" class="banner" role="status" hidden></div>
  <main id="app" tabindex="-1"></main>
  <footer class="foot">
    Market figures are <strong>market-implied chances</strong>, not forecasts by this site. Winners are shown only when a named outlet has called the race. This site makes no predictions and does not tell anyone how to vote.
  </footer>
  <script src="/vendor/topojson-client.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
